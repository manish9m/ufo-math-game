<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UFO Math Battle!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="stars" id="stars"></div>

  <!-- WELCOME SCREEN -->
  <div class="screen active" id="welcome-screen">
    <div class="title-container">
      <div class="ufo-title-icon">
        <svg viewBox="0 0 120 80" width="120">
          <defs>
            <radialGradient id="dome1" cx="50%" cy="40%"><stop offset="0%" stop-color="#a8ff78"/><stop offset="100%" stop-color="#78ffd6"/></radialGradient>
            <linearGradient id="body1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#b0bec5"/><stop offset="100%" stop-color="#78909c"/></linearGradient>
          </defs>
          <ellipse cx="60" cy="28" rx="22" ry="20" fill="url(#dome1)" opacity="0.6"/>
          <circle cx="56" cy="26" r="4" fill="#222"/><circle cx="64" cy="26" r="4" fill="#222"/>
          <ellipse cx="60" cy="26" rx="9" ry="8" fill="#b9f6ca" opacity="0.5"/>
          <ellipse cx="60" cy="42" rx="45" ry="14" fill="url(#body1)"/>
          <circle cx="28" cy="45" r="4" fill="#ff5252"><animate attributeName="opacity" values="1;0.3;1" dur="0.8s" repeatCount="indefinite"/></circle>
          <circle cx="44" cy="49" r="4" fill="#ffab40"><animate attributeName="opacity" values="1;0.3;1" dur="1s" repeatCount="indefinite"/></circle>
          <circle cx="60" cy="50" r="4" fill="#448aff"><animate attributeName="opacity" values="1;0.3;1" dur="0.6s" repeatCount="indefinite"/></circle>
          <circle cx="76" cy="49" r="4" fill="#ffab40"><animate attributeName="opacity" values="1;0.3;1" dur="1.1s" repeatCount="indefinite"/></circle>
          <circle cx="92" cy="45" r="4" fill="#ff5252"><animate attributeName="opacity" values="1;0.3;1" dur="0.9s" repeatCount="indefinite"/></circle>
          <polygon points="38,56 82,56 95,75 25,75" fill="#fff176" opacity="0.15"/>
        </svg>
      </div>
      <h1>UFO Math Battle!</h1>
      <p class="subtitle">Feed your alien with brain power!</p>
    </div>
    <div class="btn-group">
      <button class="btn btn-primary" id="btn-create">Create Game</button>
      <button class="btn btn-secondary" id="btn-join">Join Game</button>
    </div>
  </div>

  <!-- CREATE GAME SCREEN -->
  <div class="screen" id="create-screen">
    <h2>Create New Game</h2>
    <div class="form-group">
      <label>Your Name</label>
      <input type="text" id="create-name" maxlength="15" placeholder="Enter your name..." autocomplete="off" />
    </div>
    <div class="form-group">
      <label>Difficulty</label>
      <div class="radio-group">
        <label class="radio-card">
          <input type="radio" name="difficulty" value="easy" checked />
          <div class="radio-content">
            <span class="radio-title">Easy</span>
            <span class="radio-desc">Add & Subtract</span>
          </div>
        </label>
        <label class="radio-card">
          <input type="radio" name="difficulty" value="medium" />
          <div class="radio-content">
            <span class="radio-title">Medium</span>
            <span class="radio-desc">+ Multiply & Divide</span>
          </div>
        </label>
        <label class="radio-card">
          <input type="radio" name="difficulty" value="hard" />
          <div class="radio-content">
            <span class="radio-title">Hard</span>
            <span class="radio-desc">+ Roman & Words</span>
          </div>
        </label>
      </div>
    </div>
    <div class="form-group">
      <label>Win Target</label>
      <div class="radio-group">
        <label class="radio-card small">
          <input type="radio" name="target" value="5" checked />
          <div class="radio-content"><span class="radio-title">5</span><span class="radio-desc">Quick</span></div>
        </label>
        <label class="radio-card small">
          <input type="radio" name="target" value="10" />
          <div class="radio-content"><span class="radio-title">10</span><span class="radio-desc">Medium</span></div>
        </label>
        <label class="radio-card small">
          <input type="radio" name="target" value="15" />
          <div class="radio-content"><span class="radio-title">15</span><span class="radio-desc">Long</span></div>
        </label>
      </div>
    </div>
    <div class="btn-group">
      <button class="btn btn-primary" id="btn-create-room">Create Room</button>
      <button class="btn btn-back" id="btn-back-create">Back</button>
    </div>
  </div>

  <!-- JOIN GAME SCREEN -->
  <div class="screen" id="join-screen">
    <h2>Join Game</h2>
    <div class="form-group">
      <label>Your Name</label>
      <input type="text" id="join-name" maxlength="15" placeholder="Enter your name..." autocomplete="off" />
    </div>
    <div class="form-group">
      <label>Room Code</label>
      <input type="text" id="join-code" maxlength="4" placeholder="ABCD" autocomplete="off" class="code-input" />
    </div>
    <p class="error-msg" id="join-error"></p>
    <div class="btn-group">
      <button class="btn btn-primary" id="btn-join-room">Join Room</button>
      <button class="btn btn-back" id="btn-back-join">Back</button>
    </div>
  </div>

  <!-- LOBBY SCREEN -->
  <div class="screen" id="lobby-screen">
    <h2>Game Lobby</h2>
    <div class="room-code-display">
      <span>Room Code</span>
      <div class="code" id="lobby-code"></div>
      <p class="hint">Share this code with your friend!</p>
    </div>
    <div class="lobby-players" id="lobby-players"></div>
    <div class="lobby-settings">
      <span id="lobby-difficulty"></span>
      <span id="lobby-target"></span>
    </div>
    <div class="waiting-msg" id="waiting-msg">Waiting for another player...</div>
    <button class="btn btn-primary" id="btn-start" style="display:none">Start Game!</button>
  </div>

  <!-- GAME SCREEN -->
  <div class="screen" id="game-screen">
    <div class="game-header">
      <div class="player-info p1" id="player1-info">
        <div class="player-ufo">
          <svg viewBox="0 0 100 70" width="70">
            <defs>
              <radialGradient id="d1g" cx="50%" cy="40%"><stop offset="0%" stop-color="#64ffda"/><stop offset="100%" stop-color="#00bcd4"/></radialGradient>
              <linearGradient id="b1g" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#4dd0e1"/><stop offset="100%" stop-color="#00838f"/></linearGradient>
            </defs>
            <ellipse cx="50" cy="24" rx="18" ry="16" fill="url(#d1g)" opacity="0.6"/>
            <circle cx="46" cy="22" r="3" fill="#222"/><circle cx="54" cy="22" r="3" fill="#222"/>
            <ellipse cx="50" cy="35" rx="38" ry="12" fill="url(#b1g)"/>
            <circle cx="22" cy="38" r="3" fill="#ff5252"><animate attributeName="opacity" values="1;0.3;1" dur="0.7s" repeatCount="indefinite"/></circle>
            <circle cx="36" cy="41" r="3" fill="#ffab40"><animate attributeName="opacity" values="1;0.3;1" dur="1s" repeatCount="indefinite"/></circle>
            <circle cx="50" cy="42" r="3" fill="#69f0ae"><animate attributeName="opacity" values="1;0.3;1" dur="0.5s" repeatCount="indefinite"/></circle>
            <circle cx="64" cy="41" r="3" fill="#ffab40"><animate attributeName="opacity" values="1;0.3;1" dur="0.9s" repeatCount="indefinite"/></circle>
            <circle cx="78" cy="38" r="3" fill="#ff5252"><animate attributeName="opacity" values="1;0.3;1" dur="0.8s" repeatCount="indefinite"/></circle>
            <polygon points="32,47 68,47 78,65 22,65" fill="#64ffda" opacity="0.12"/>
          </svg>
        </div>
        <div class="player-name" id="p1-name">Player 1</div>
        <div class="player-score"><span id="p1-score">0</span> / <span id="p1-target"></span></div>
      </div>
      <div class="game-status" id="game-status">Get Ready!</div>
      <div class="player-info p2" id="player2-info">
        <div class="player-ufo">
          <svg viewBox="0 0 100 70" width="70">
            <defs>
              <radialGradient id="d2g" cx="50%" cy="40%"><stop offset="0%" stop-color="#ea80fc"/><stop offset="100%" stop-color="#ce93d8"/></radialGradient>
              <linearGradient id="b2g" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ce93d8"/><stop offset="100%" stop-color="#7b1fa2"/></linearGradient>
            </defs>
            <ellipse cx="50" cy="24" rx="18" ry="16" fill="url(#d2g)" opacity="0.6"/>
            <circle cx="46" cy="22" r="3" fill="#222"/><circle cx="54" cy="22" r="3" fill="#222"/>
            <ellipse cx="50" cy="35" rx="38" ry="12" fill="url(#b2g)"/>
            <circle cx="22" cy="38" r="3" fill="#ffab40"><animate attributeName="opacity" values="1;0.3;1" dur="0.8s" repeatCount="indefinite"/></circle>
            <circle cx="36" cy="41" r="3" fill="#ff5252"><animate attributeName="opacity" values="1;0.3;1" dur="0.6s" repeatCount="indefinite"/></circle>
            <circle cx="50" cy="42" r="3" fill="#ea80fc"><animate attributeName="opacity" values="1;0.3;1" dur="1s" repeatCount="indefinite"/></circle>
            <circle cx="64" cy="41" r="3" fill="#ff5252"><animate attributeName="opacity" values="1;0.3;1" dur="0.7s" repeatCount="indefinite"/></circle>
            <circle cx="78" cy="38" r="3" fill="#ffab40"><animate attributeName="opacity" values="1;0.3;1" dur="0.9s" repeatCount="indefinite"/></circle>
            <polygon points="32,47 68,47 78,65 22,65" fill="#ea80fc" opacity="0.12"/>
          </svg>
        </div>
        <div class="player-name" id="p2-name">Player 2</div>
        <div class="player-score"><span id="p2-score">0</span> / <span id="p2-target"></span></div>
      </div>
    </div>

    <div class="track-container">
      <div class="track-ufo track-ufo-left">
        <svg viewBox="0 0 60 50" width="48">
          <ellipse cx="30" cy="15" rx="12" ry="10" fill="#64ffda" opacity="0.5"/>
          <circle cx="27" cy="14" r="2" fill="#222"/><circle cx="33" cy="14" r="2" fill="#222"/>
          <ellipse cx="30" cy="22" rx="25" ry="8" fill="#4dd0e1"/>
          <polygon points="18,30 42,30 50,44 10,44" fill="#64ffda" opacity="0.15"/>
        </svg>
      </div>
      <div class="track" id="track">
        <div class="track-bar"></div>
        <div class="track-positions" id="track-positions"></div>
        <div class="food-item" id="food-item"></div>
      </div>
      <div class="track-ufo track-ufo-right">
        <svg viewBox="0 0 60 50" width="48">
          <ellipse cx="30" cy="15" rx="12" ry="10" fill="#ea80fc" opacity="0.5"/>
          <circle cx="27" cy="14" r="2" fill="#222"/><circle cx="33" cy="14" r="2" fill="#222"/>
          <ellipse cx="30" cy="22" rx="25" ry="8" fill="#ce93d8"/>
          <polygon points="18,30 42,30 50,44 10,44" fill="#ea80fc" opacity="0.15"/>
        </svg>
      </div>
    </div>

    <div class="question-area" id="question-area">
      <div class="question-text" id="question-text"></div>
      <div class="timer-bar" id="timer-bar"><div class="timer-fill" id="timer-fill"></div></div>
      <div class="answer-area" id="answer-area" style="display:none">
        <input type="text" id="answer-input" placeholder="Type your answer..." autocomplete="off" />
        <button class="btn btn-submit" id="btn-submit">Submit</button>
      </div>
      <div class="info-text" id="info-text"></div>
    </div>

    <div class="collected-items" id="collected-items"></div>
  </div>

  <!-- WINNER SCREEN -->
  <div class="screen" id="winner-screen">
    <div id="confetti-container"></div>
    <div class="winner-content">
      <div class="winner-ufo" id="winner-ufo"></div>
      <h1 class="winner-title" id="winner-title">Winner!</h1>
      <p class="winner-name" id="winner-name-display"></p>
      <div class="final-scores" id="final-scores"></div>
      <button class="btn btn-primary" id="btn-play-again">Play Again!</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="game.js"></script>
</body>
</html>
